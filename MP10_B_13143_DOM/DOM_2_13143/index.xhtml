<!DOCTYPE html>
<html>
    
<head>
    <title>DOM_2_3143</title>
</head>
<button onclick="konversi()">Konversi</button>

<script src="script.js"></script>

<body>

<h2>Konversi Celsius ke Fahrenheit</h2>

<label>Masukkan Suhu Celsius:</label>
<input type="number" id="celsius">
<br><br>

<button onclick="konversi()">Konversi</button>

<h3 id="hasil"></h3>

<script>
    function konversi() {

        let celsius =
            document.getElementById("celsius").value;

        let fahrenheit =
            (9 / 5 * celsius) + 32;

        document.getElementById("hasil").innerHTML =
            celsius + " °C = " +
            fahrenheit + " °F";
    }
</script>

</body>
</html>
