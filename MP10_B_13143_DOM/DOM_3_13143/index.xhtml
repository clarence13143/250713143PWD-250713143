<!DOCTYPE html>
<html>
<head>
    <title>DOM_3_3143</title>

    <style>
        body{
            font-family: Arial;
        }

        input{
            padding:8px;
        }

        button{
            padding:8px 12px;
            margin:5px;
        }

        #hasil{
            margin-top:15px;
            font-weight:bold;
        }
    </style>
</head>

<script src="script.js"></script>

<body>

<h2>Konversi Suhu dan Status Cuaca</h2>

<label>Suhu Celsius :</label>
<input type="number" id="celsius">
<br><br>

<button onclick="konversi()">Konversi</button>
<button onclick="resetData()">Reset</button>

<div id="hasil"></div>

<script>

function konversi(){

    let celsius =
        parseFloat(document.getElementById("celsius").value);

    if(isNaN(celsius)){
        alert("Masukkan suhu terlebih dahulu!");
        return;
    }

    let fahrenheit =
        (9/5 * celsius) + 32;

    let status = "";

    if(celsius < 20){
        status = "Dingin";
    }
    else if(celsius <= 30){
        status = "Normal";
    }
    else{
        status = "Panas";
    }

    document.getElementById("hasil").innerHTML =
        "Celsius : " + celsius + " °C<br>" +
        "Fahrenheit : " + fahrenheit.toFixed(2) + " °F<br>" +
        "Status Cuaca : " + status;
}

function resetData(){

    document.getElementById("celsius").value = "";
    document.getElementById("hasil").innerHTML = "";
}

</script>

</body>
</html>
