<!DOCTYPE html>

<html>
<head>
    <title>DOM_1_3143</title>
</head>

<script src="script.js"></script>

<body>

<h2>Konversi Celsius ke Fahrenheit</h2>

<script>
    let celsius = prompt("Masukkan suhu dalam Celsius:");

    let fahrenheit = (9/5 * celsius) + 32;

    document.write("<h3>Hasil Konversi</h3>");
    document.write("Suhu Celsius : " + celsius + " °C<br>");
    document.write("Suhu Fahrenheit : " + fahrenheit + " °F");
</script>

</body>
</html>
