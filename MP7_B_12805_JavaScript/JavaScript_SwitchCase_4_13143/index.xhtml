<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict/EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title>Switch-Case: Metode Pembayaran</title>
    <meta http-equiv="content-type" content="text/html; charset=utf-8">
    <script type="text/javascript">
        var sInput;
        sInput= prompt("pilih pembayaran: (T)ransfer, (Q)ris, (C)OD, (K)artu Kredit", "T");
        switch(sInput){
            case "T":
                alert("pembayaran via Transfer Bank");
                break;
            case "Q":
                alert("pembayaran via QRIS");
                break;
            case "C":
                alert("pembayaran di tempat COD");
                break;
            case "K":
                alert("pembayaran via Kartu Kredit");
                break;
            default:
                alert("metode pembayaran tidak tersedia");
        }//switch1
</script>
</head>

<body>
    <h1>Switch-Case: Metode Pembayaran</h1>
    <p>Reload halaman untuk mencoba lagi.</p>
</body>

</html>
