<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict/EN" 
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">

<head>
    <title>Form Keluhan Pelanggan (XHTML)</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <script type="text/javascript">
        function fn_ValForm()
        {
            var sMsg = "";

            if(document.getElementById("nama").value=="")
            {
                sMsg += "\n* Anda belum mengisi nama";
            }//if1
            if(document.getElementById("nomor_pesanan").value=="")
            {
                sMsg += "\n* Anda belum mengisi nomor pesanan";
            }//if2
            if(document.getElementById("keluhan").value=="")
            {
                sMsg += "\n* Anda belum mengisi keluhan";
            }//if3
            if(sMsg!="")
            {
                alert("peringatan:\n" + sMsg);
                return false;
            }else{
                return true
            }//if4
            return true;
        }
    </script>
</head>

<body>
    <h1>Form Keluhan Pelanggan</h1>
    <form action="#" method="post" onsubmit="return fn_ValForm();">
        <p>Nama Pelanggan: <br /><input type="text" id="nama" name="nama" /></p>
        <p>Nomor Pesanan: <br /><input type="text" id="nomor_pesanan" name="nomor_pesanan" /></p>
        <p>Keluhan: <br /><textarea id="keluhan" name="keluhan" rows="4" cols="30"></textarea></p>
        <p><input type="submit" value="send" /></p>
    </form>
</body>

</html>
